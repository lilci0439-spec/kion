<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кино вдвоём</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--tg-theme-bg-color,#140c08);color:var(--tg-theme-text-color,#f6e7d2);font:15px system-ui,sans-serif;padding:10px env(safe-area-inset-right) calc(10px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.w{max-width:560px;margin:0 auto;padding:0 10px}
.st{text-align:center;font-size:13px;opacity:.8;margin:4px 0 8px}
.box{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#999;text-align:center;padding:8px}
.box video,.box iframe,.box #yt{width:100%;height:100%;border:0}
.row{display:flex;gap:8px;margin-top:8px}
input[type=text]{flex:1;min-width:0;font:inherit;color:inherit;background:rgba(255,200,140,.14);border:0;border-radius:10px;min-height:44px;padding:0 12px}
button,.b{flex:1;font:inherit;color:inherit;background:rgba(255,200,140,.14);border:0;border-radius:10px;min-height:44px;padding:0 10px;text-align:center;line-height:44px;cursor:pointer}
.main{background:#ffb55a;color:#2a1205;font-weight:800;width:100%;margin-top:8px}
.cd{text-align:center;font-size:24px;font-weight:800;min-height:32px;color:#ffb55a;margin-top:6px}
#lg{margin-top:8px;font-size:14px;max-height:120px;overflow:auto}
.fl{position:fixed;bottom:100px;font-size:32px;pointer-events:none;animation:f 1.2s forwards}
@keyframes f{to{transform:translateY(-160px);opacity:0}}
</style></head><body><div class="w">
<div class="st" id="st">Подключаюсь…</div>
<div class="box" id="box">Вставь ссылку или выбери файл ниже</div>
<div class="row"><input type="text" id="u" placeholder="Ссылка: YouTube, .mp4, .m3u8 или любая"><button id="ld" style="flex:0 0 56px">▶</button></div>
<div class="row"><label class="b" for="f">📁 Файл с телефона</label><input type="file" id="f" accept="video/*" hidden><button id="ob">↗ В браузере</button></div>
<div class="row"><button id="m">−10</button><button id="p">▶</button><button id="z">⏸</button><button id="a">+10</button></div>
<button class="main" id="go">Старт вместе 3-2-1</button>
<div class="cd" id="cd"></div>
<div class="row"><button class="r" data-i="0">❤️</button><button class="r" data-i="1">😂</button><button class="r" data-i="2">😱</button><button class="r" data-i="3">😢</button></div>
<div class="row"><input type="text" id="ci" placeholder="Сообщение"><button id="cs" style="flex:0 0 56px">➤</button></div>
<div id="lg"></div>
<button id="sh" class="main" style="background:rgba(255,200,140,.14);color:inherit">Позвать её</button>
</div>
<script>
const APP_LINK="https://t.me/ВАШ_БОТ/kino"; // ← вставь свою ссылку
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=i=>document.getElementById(i),box=$("box"),st=t=>$("st").textContent=t;
let room=((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||new URLSearchParams(location.search).get("room")||"").replace(/\W/g,"");
const host=!room;if(host)room=Math.random().toString(36).slice(2,8);
let peer,conn,kind,vid,yt,cur,lock,lk,cdT;
const send=o=>{if(conn&&conn.open)conn.send(o)};
function net(){
peer=host?new Peer("kino-"+room):new Peer();
peer.on("connection",c=>{if(!conn||!conn.open)link(c)});
peer.on("open",()=>{if(host)st("Комната готова. Жми «Позвать её»");else join()});
peer.on("error",e=>{if(e.type=="peer-unavailable"&&!host){st("Жду, пока откроют комнату…");setTimeout(join,3000)}else st("Ошибка связи: "+e.type)})}
function join(){link(peer.connect("kino-"+room,{reliable:true}))}
function link(c){conn=c;c.on("open",()=>{st("● Вы вместе онлайн");if(cur)send({t:"load",k:cur.k,s:cur.s,n:cur.n})});c.on("data",recv);c.on("close",()=>st("Связь пропала"))}
function recv(m){
if(m.t=="load")load(m.k,m.s,m.n);
else if(m.t=="play"||m.t=="pause"||m.t=="seek")act(m.t,m.x);
else if(m.t=="cd")countdown();
else if(m.t=="chat")chat(m.x,0);
else if(m.t=="r")fly(m.x)}
function ytReady(cb){if(window.YT&&YT.Player)return cb();window.onYouTubeIframeAPIReady=cb;if(!window.ytS){window.ytS=1;const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s)}}
function load(k,s,n){
kind=k;vid=yt=null;cur={k,n,s:k=="file"?undefined:s};box.innerHTML="";
if(k=="file"&&!s){box.textContent="Выбери тот же файл кнопкой 📁: "+n;return}
if(k=="yt"){box.innerHTML='<div id="yt"></div>';ytReady(()=>{yt=new YT.Player("yt",{videoId:s,playerVars:{playsinline:1},events:{onStateChange:e=>{if(lock)return;const x=yt.getCurrentTime();if(e.data==1)send({t:"play",x});if(e.data==2)send({t:"pause",x})}}})})}
else if(k=="if"){if(!/^https?:/.test(s)){st("Нужна ссылка с http");return}const f=document.createElement("iframe");f.src=s;f.allow="autoplay;fullscreen";f.allowFullscreen=true;box.appendChild(f);st("Страницу нельзя синхронизировать: используй «Старт вместе»")}
else{vid=document.createElement("video");vid.controls=true;vid.setAttribute("playsinline","");
if(k=="hls"&&!vid.canPlayType("application/vnd.apple.mpegurl")&&window.Hls&&Hls.isSupported()){const h=new Hls();h.loadSource(s);h.attachMedia(vid)}else vid.src=s;
["play","pause","seeked"].forEach(ev=>vid.addEventListener(ev,()=>{if(!lock)send({t:ev=="seeked"?"seek":ev,x:vid.currentTime})}));
box.appendChild(vid)}}
function act(a,x){lock=true;clearTimeout(lk);lk=setTimeout(()=>lock=0,900);
try{if(x!=null){if(kind=="yt"&&yt)yt.seekTo(x,true);else if(vid)vid.currentTime=x}
if(a=="play"){if(kind=="yt"&&yt)yt.playVideo();else if(vid)vid.play().catch(()=>st("Нажми ▶ на видео"))}
if(a=="pause"){if(kind=="yt"&&yt)yt.pauseVideo();else if(vid)vid.pause()}}catch(e){}}
const T=()=>kind=="yt"&&yt&&yt.getCurrentTime?yt.getCurrentTime():vid?vid.currentTime:0;
function kindOf(u){if(/youtu\.be\/|youtube\.com/.test(u))return"yt";if(/\.(mp4|webm|mov|m4v)(\?|$)/i.test(u))return"vid";if(/\.m3u8(\?|$)/i.test(u))return"hls";return"if"}
$("ld").onclick=()=>{const u=$("u").value.trim();if(!u)return;const k=kindOf(u);let s=u;
if(k=="yt"){const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);if(!m){st("Не вижу id видео");return}s=m[1]}
load(k,s,"");send({t:"load",k,s,n:""})};
$("f").onchange=e=>{const f=e.target.files[0];if(!f)return;const same=cur&&cur.k=="file"&&cur.n==f.name;load("file",URL.createObjectURL(f),f.name);if(!same)send({t:"load",k:"file",n:f.name})};
$("ob").onclick=()=>{const u=$("u").value.trim();if(u)tg?tg.openLink(u):window.open(u)};
$("p").onclick=()=>{act("play");send({t:"play",x:T()})};
$("z").onclick=()=>{act("pause");send({t:"pause",x:T()})};
$("m").onclick=()=>{const x=Math.max(0,T()-10);act("seek",x);send({t:"seek",x})};
$("a").onclick=()=>{const x=T()+10;act("seek",x);send({t:"seek",x})};
function countdown(){let n=3;clearInterval(cdT);$("cd").textContent=n+"…";
cdT=setInterval(()=>{n--;if(n>0){$("cd").textContent=n+"…";navigator.vibrate&&navigator.vibrate(30)}else{clearInterval(cdT);$("cd").textContent="▶ ЖМИ PLAY";act("play");setTimeout(()=>$("cd").textContent="",3000)}},1000)}
$("go").onclick=()=>{send({t:"cd"});countdown()};
function fly(i){const s=document.createElement("span");s.className="fl";s.textContent=["❤️","😂","😱","😢"][i];s.style.left=(15+Math.random()*70)+"%";document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}
document.querySelectorAll(".r").forEach(b=>b.onclick=()=>{fly(+b.dataset.i);send({t:"r",x:+b.dataset.i})});
function chat(x,me){const d=document.createElement("div");d.textContent=(me?"Я: ":"Партнёр: ")+x;$("lg").prepend(d)}
$("cs").onclick=()=>{const x=$("ci").value.trim();if(!x)return;chat(x,1);send({t:"chat",x});$("ci").value=""};
$("sh").onclick=()=>{const l=APP_LINK+"?startapp="+room,t="Смотрим вместе 🎬";if(tg)tg.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(l)+"&text="+encodeURIComponent(t));else{navigator.clipboard.writeText(l);st("Ссылка скопирована")}};
net();
</script></body></html>
